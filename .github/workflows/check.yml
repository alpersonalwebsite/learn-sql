# Runs the checks on every push and pull request.
#
# The point of this repository is that the SQL samples and their documented results agree, and that is
# only true as long as something verifies it. Before this file, nothing did unless somebody typed
# `make check`.
#
# No install step: sqlite3 ships with Python, and the checkers use nothing else.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - run: make check
